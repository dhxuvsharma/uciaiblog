# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: uci-ai-lab-blog
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: uci-ai-lab-db
          property: connectionString
databases:
  - name: uci-ai-lab-db

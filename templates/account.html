{% extends "base.html" %}
{% block title %}Account · {{ site_name }}{% endblock %}
{% block content %}
<div class="container narrow">
  <div class="page-head"><h1>Account settings</h1></div>
  <div class="panel">
    <h3>Profile</h3>
    <form method="post" class="form">
      {% include "partials/csrf.html" %}<input type="hidden" name="action" value="profile">
      <div class="row-2">
        <div class="field"><label for="name">Name</label><input id="name" name="name" value="{{ current_user.name }}" required></div>
        <div class="field"><label for="affiliation">Affiliation</label><input id="affiliation" name="affiliation" value="{{ current_user.affiliation or '' }}"></div>
      </div>
      <div class="field"><label for="bio">Short bio</label><textarea id="bio" name="bio" rows="3" maxlength="1000">{{ current_user.bio or '' }}</textarea></div>
      <div class="form-actions"><button class="btn btn-primary">Save profile</button></div>
    </form>
  </div>
  <div class="panel">
    <h3>Change password</h3>
    <form method="post" class="form">
      {% include "partials/csrf.html" %}<input type="hidden" name="action" value="password">
      <div class="row-2">
        <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" required></div>
        <div class="field"><label for="new">New password</label><input id="new" name="new" type="password" minlength="8" required></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary">Update password</button></div>
    </form>
  </div>
</div>
{% endblock %}

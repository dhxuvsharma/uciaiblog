<div class="row-actions">
  {% if p.status != 'published' %}
  <form method="post" action="{{ url_for('admin_post_action', pid=p.id, action='approve') }}" class="inline">{% include "partials/csrf.html" %}<input type="hidden" name="next" value="{{ request.full_path }}"><button class="btn btn-xs btn-success">{{ 'Approve' if p.status=='pending' else 'Publish' }}</button></form>
  {% else %}
  <form method="post" action="{{ url_for('admin_post_action', pid=p.id, action='hide') }}" class="inline">{% include "partials/csrf.html" %}<input type="hidden" name="next" value="{{ request.full_path }}"><button class="btn btn-xs btn-ghost">Hide</button></form>
  {% endif %}
  <form method="post" action="{{ url_for('admin_post_action', pid=p.id, action='feature') }}" class="inline">{% include "partials/csrf.html" %}<input type="hidden" name="next" value="{{ request.full_path }}"><button class="btn btn-xs btn-ghost {{ 'is-on' if p.featured }}" title="Feature on home page">{{ '★ Featured' if p.featured else '☆ Feature' }}</button></form>
  <a class="btn btn-xs btn-ghost" href="{{ url_for('edit_post', pid=p.id) }}">Edit</a>
  <form method="post" action="{{ url_for('admin_post_action', pid=p.id, action='delete') }}" class="inline" data-confirm="Delete “{{ p.title }}” permanently?">{% include "partials/csrf.html" %}<input type="hidden" name="next" value="{{ request.full_path }}"><button class="btn btn-xs btn-ghost danger">Delete</button></form>
</div>
